\* One fire, for a readable chart. Two fires reach 582 states, past the chart budget of 500.
\* With one fire, "the pill is hidden" conditions on the trigger and spinner arrows come from
\* this bound; with more fires a new trigger and spinner can appear while a pill is up.
SPECIFICATION Spec
CONSTANTS
  MaxFires = 1
  HUD = TRUE
INVARIANTS
  GatedFireShowsNothing
  SpinnerGoneBeforeItsPill
  OnePillPerFinishedFire
  NoStaleHide
  SpinnerGoneAtRest
  PillGoneAtRest
